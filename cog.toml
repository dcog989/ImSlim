#:schema https://docs.cocogitto.io/cog-schema.json

branch_whitelist = ["main"]
ignore_merge_commits = true
tag_prefix = "v"

# Keep the package manifest and __version__ in sync with the bumped tag.
# `{{version}}` is replaced by cog with the target version before the hooks run.
pre_bump_hooks = [
    "uv run ruff check",
    "uv run ruff format --check",
    "uv run basedpyright src/imslim",
    "uv run pytest",
    "sed -i 's/^version = .*/version = \"{{version}}\"/' pyproject.toml && grep -q '^version = \"{{version}}\"' pyproject.toml",
    "sed -i 's/^__version__ = .*/__version__ = \"{{version}}\"/' src/imslim/__init__.py && grep -q '^__version__ = \"{{version}}\"' src/imslim/__init__.py",
    "uv lock",
]

post_bump_hooks = [
    "git push",
    "git push origin {{version_tag}}",
]

# cog's built-in title for `perf` is "Performance Improvements", which the
# template's "Performance" group never matched, so perf commits were dropped.
[commit_types]
perf = { changelog_title = "Performance" }

[changelog]
path = "CHANGELOG.md"
template = "changelog.tpl"
