#:schema https://docs.cocogitto.io/cog-schema.json

branch_whitelist = ["main"]
ignore_merge_commits = true

# Keep the package manifest and __version__ in sync with the bumped tag.
# `{{version}}` is replaced by cog with the target version before the hooks run.
pre_bump_hooks = [
    "sed -i 's/^version = .*/version = \"{{version}}\"/' pyproject.toml",
    "sed -i 's/^__version__ = .*/__version__ = \"{{version}}\"/' src/imslim/__init__.py",
]

post_bump_hooks = [
    "git push",
    "git push origin {{version}}",
]

[changelog]
path = "CHANGELOG.md"
template = "changelog.tpl"
