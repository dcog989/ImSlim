pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.py"
      run: uv run ruff check {staged_files}
    format:
      glob: "*.py"
      run: uv run ruff format --check {staged_files}

commit-msg:
  commands:
    commitizen:
      run: uv run cz check --message-length-limit 100 --commit-msg-file {1}
