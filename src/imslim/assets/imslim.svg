<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <title>ImSlim Logo</title>
  <g fill="#8a8a8a">
    <!-- Top Horizontal Bar -->
    <rect x="150" y="90" width="200" height="32" rx="8" />

    <!-- Tapered Center Vertical Bar -->
    <!-- Top width: 100px (200 to 300), Middle width: 20px (240 to 260), Bottom width: 100px (200 to 300) -->
    <path
      d="M 200,138
             H 300
             Q 220,250 300,362
             H 200
             Q 280,250 200,138 Z"
    />

    <!-- Bottom Horizontal Bar -->
    <rect x="150" y="378" width="200" height="32" rx="8" />
  </g>
</svg>
