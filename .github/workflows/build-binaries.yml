name: build-binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake ninja-build pkg-config curl git \
            libpng-dev zlib1g-dev libjpeg-dev libwebp-dev \
            libhwy-dev libbrotli-dev liblcms2-dev libaom-dev libyuv-dev \
            libdav1d-dev \
            libsqlite3-dev libzstd-dev libtiff-dev

      - name: Install Rust for oxipng
        uses: dtolnay/rust-toolchain@stable

      - name: Build bundled tools
        run: ./scripts/build_tools.sh

      - name: Install Python + uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"

      - name: Build wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: imslim-wheel
          path: dist/*.whl

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl