name: release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux AppImage (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake ninja-build pkg-config curl git \
            libpng-dev zlib1g-dev libjpeg-dev libwebp-dev \
            libhwy-dev libbrotli-dev liblcms2-dev libaom-dev libyuv-dev \
            libdav1d-dev \
            libsqlite3-dev libzstd-dev libtiff-dev \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install Rust for oxipng/pngquant
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python + uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Sync dependencies (incl. pyinstaller)
        run: uv sync --group dev

      - name: Build bundled tools
        run: ./scripts/build_tools.sh --no-deps

      - name: Package AppImage
        run: ./scripts/package_linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: imslim-linux-x86_64
          path: dist/ImSlim-*-linux-x86_64.AppImage

  wheel:
    name: Build wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Build wheel
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: imslim-wheel
          path: dist/*.whl

  publish:
    name: Publish GitHub release
    needs: [linux, wheel]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME}"
          init_ver="$(python3 -c 'import sys; sys.path.insert(0,"src"); print(__import__("imslim").__version__)')"
          proj_ver="$(awk -F'"' '/^version = /{print $2}' pyproject.toml)"
          if [[ "$tag" != "v$init_ver" || "$init_ver" != "$proj_ver" ]]; then
            echo "version mismatch: tag=$tag, __version__=$init_ver, pyproject.toml=$proj_ver" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          name: imslim-linux-x86_64
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: imslim-wheel
          path: dist

      - name: Extract changelog for release body
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 ~ "^## " tag " " { found=1; next }
            found && /^- - -$/ { exit }
            found { print }
          ' CHANGELOG.md > release-body.md

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/ImSlim-*-linux-x86_64.AppImage
            dist/*.whl
            CHANGELOG.md
          body_path: release-body.md
          generate_release_notes: true