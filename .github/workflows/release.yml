name: release

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux AppImage (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake ninja-build pkg-config curl git \
            libpng-dev zlib1g-dev libjpeg-dev libwebp-dev \
            libhwy-dev libbrotli-dev liblcms2-dev libaom-dev libyuv-dev \
            libdav1d-dev \
            libsqlite3-dev libzstd-dev libtiff-dev \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install Rust for oxipng/pngquant
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python + uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Sync dependencies (incl. pyinstaller)
        run: uv sync --group dev

      - name: Build bundled tools
        run: ./scripts/build_tools.sh

      - name: Package AppImage
        run: ./scripts/package_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: imslim-linux-x86_64
          path: dist/ImSlim-*-linux-x86_64.AppImage

      - name: Extract changelog for release body
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 ~ "^## " tag " " { found=1; next }
            found && /^- - -$/ { exit }
            found { print }
          ' CHANGELOG.md > release-body.md

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ImSlim-*-linux-x86_64.AppImage
          body_path: release-body.md
