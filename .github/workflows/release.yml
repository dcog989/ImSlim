name: release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux AppImage (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore bundled tools cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .build/.versions
            .build/appimagetool
            src/imslim/bin/linux-x86_64
          key: tools-${{ hashFiles('tools.lock') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake ninja-build pkg-config curl git \
            libpng-dev zlib1g-dev libjpeg-dev libwebp-dev \
            libhwy-dev libbrotli-dev liblcms2-dev libaom-dev libyuv-dev \
            libdav1d-dev \
            libsqlite3-dev libzstd-dev libtiff-dev \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install Rust for oxipng/pngquant
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Python + uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies (incl. pyinstaller)
        run: uv sync --group dev

      - name: Build bundled tools
        run: ./scripts/build_tools.sh --no-deps

      - name: Package AppImage
        run: ./scripts/package_linux.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: imslim-linux-x86_64
          path: dist/ImSlim-*-linux-x86_64.AppImage

  wheel:
    name: Build wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build wheel
        run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: imslim-wheel
          path: dist/*.whl

  publish:
    name: Publish GitHub release
    needs: [linux, wheel]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME}"
          init_ver="$(python3 -c 'import sys; sys.path.insert(0,"src"); print(__import__("imslim").__version__)')"
          proj_ver="$(awk -F'"' '/^version = /{print $2}' pyproject.toml)"
          if [[ "$tag" != "v$init_ver" || "$init_ver" != "$proj_ver" ]]; then
            echo "version mismatch: tag=$tag, __version__=$init_ver, pyproject.toml=$proj_ver" >&2
            exit 1
          fi

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: imslim-linux-x86_64
          path: dist

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: imslim-wheel
          path: dist

      - name: Extract changelog for release body
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 ~ "^## " tag " " { found=1; next }
            found && /^- - -$/ { exit }
            found { print }
          ' CHANGELOG.md > release-body.md

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          files: |
            dist/ImSlim-*-linux-x86_64.AppImage
            dist/*.whl
            CHANGELOG.md
          body_path: release-body.md
          generate_release_notes: true