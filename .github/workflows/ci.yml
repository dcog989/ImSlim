name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Install cocogitto
        if: github.event_name == 'pull_request'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cocogitto

      - name: Commit message check
        if: github.event_name == 'pull_request'
        run: cog check -i origin/${{ github.base_ref }}..HEAD

  typecheck:
    name: Type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --locked

      - name: BasedPyright
        run: uv run basedpyright src/imslim

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --locked

      # QtWidgets needs these at import time; the runner image lacks libEGL.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Pytest
        run: uv run pytest

  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The wheel carries the gitignored bundled tools, so building them (or
      # restoring the release cache) is part of validating the distribution.
      - name: Restore bundled tools cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .build/.versions
            .build/.config-hashes
            .build/appimagetool
            src/imslim/bin/linux-x86_64
          key: tools-${{ hashFiles('tools.lock', 'scripts/build_tools.sh', 'svgo/package-lock.json') }}
          restore-keys: tools-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake ninja-build pkg-config curl git \
            autoconf automake libtool nasm \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install Rust for oxipng/pngquant
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --locked

      - name: Build bundled tools
        run: ./scripts/build_tools.sh --no-deps

      - name: Build wheel and sdist
        run: make build

      - name: Check the wheel bundles the tools
        run: unzip -l dist/*.whl | grep -q "imslim/bin/"

      - name: Smoke-run the wheel
        run: |
          tmp="$(mktemp -d)"
          unzip -q dist/*.whl -d "$tmp"
          PYTHONPATH="$tmp" QT_QPA_PLATFORM=offscreen uv run python -m imslim --version
          rm -rf "$tmp"

      - name: Package AppImage
        run: ./scripts/package_linux.sh

      - name: Smoke-run the bundled app
        run: |
          QT_QPA_PLATFORM=offscreen dist/pyinstaller/ImSlim/ImSlim --version
          QT_QPA_PLATFORM=offscreen dist/pyinstaller/ImSlim/ImSlim --help >/dev/null

      - name: Smoke-run the AppImage runtime
        run: ./dist/ImSlim-*-linux-x86_64.AppImage --appimage-extract-and-run --version

      - name: Run the encoder tests against the bundled tools
        run: uv run pytest tests/test_encoder_behavior.py
