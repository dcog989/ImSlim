version: 2
updates:
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      pyside:
        patterns:
          - 'PySide6*'
      tooling:
        patterns:
          - 'pyinstaller'
          - 'ruff'
          - 'basedpyright'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
