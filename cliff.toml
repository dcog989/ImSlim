# git-cliff configuration — generates CHANGELOG.md from conventional commits.
# https://git-cliff.org/docs/configuration
#
# Only feat/fix/perf/refactor commits surface in the changelog; everything
# else (style, chore, docs, test, ci, ...) is noise and filtered out via
# `filter_commits`. Run at release time:
#   git-cliff -o CHANGELOG.md
# (git-cliff is an external Rust tool; it is not a project dependency.)

[changelog]
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
# The <!-- N --> markers are stripped by `striptags` and only order the groups.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^revert", skip = true },
    { message = "^merge", skip = true },
]
filter_commits = true
sort_commits = "oldest"