[project]
name = "imslim"
version = "0.11.2"
description = "Compress common image formats."
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "dcog989" }]
keywords = [
  "avif",
  "gif",
  "image-compression",
  "image-conversion",
  "jpeg",
  "jxl",
  "png",
  "qt",
  "svg",
  "webp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: System :: Archiving :: Compression",
]
dependencies = [
  "PySide6>=6.11",
]

[project.urls]
Homepage = "https://github.com/dcog989/ImSlim"
Issues = "https://github.com/dcog989/ImSlim/issues"
Repository = "https://github.com/dcog989/ImSlim"

[project.scripts]
imslim = "imslim.main:main"

[dependency-groups]
dev = [
  "basedpyright>=1.40",
  "pyinstaller>=6.22",
  "pytest>=8",
  "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"

[tool.basedpyright]
# Pin what CI enforces so a bare `basedpyright` run agrees with the workflows
# and the cog hook: basedpyright's own default mode, over the app package only.
typeCheckingMode = "recommended"
include = ["src/imslim"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# The broad `except Exception` blocks on the external-tool paths are
# intentional: they surface tool failures to the user instead of aborting the
# batch, so BLE001 is ignored.
ignore = ["BLE001"]
