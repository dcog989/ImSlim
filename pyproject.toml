[project]
name = "imslim"
version = "0.10.0"
description = "Compress common image formats."
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "PySide6>=6.11",
]

[project.scripts]
imslim = "imslim.main:main"

[dependency-groups]
dev = [
  "basedpyright>=1.40",
  "pyinstaller>=6.22",
  "pytest>=8",
  "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
ignore = [
  "BLE001",  # broad excepts intentionally surface external tool failures to the user
]
