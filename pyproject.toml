[project]
name = "imslim"
version = "0.10.0"
description = "Compress common image formats."
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "PySide6>=6.11",
]

[project.scripts]
imslim = "imslim.main:main"

[dependency-groups]
dev = [
  "basedpyright>=1.40",
  "pyinstaller>=6.22",
  "pytest>=8",
  "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Defaults only (E4/E7/E9/F). The broad `except Exception` blocks on the
# external-tool paths are intentional, so BLE001 is left unselected rather than
# ignored: an `ignore` for a rule that is never selected is dead config.

[tool.basedpyright]
# Pin what CI enforces so a bare `basedpyright` run agrees with the workflows
# and the cog hook: basedpyright's own default mode, over the app package only.
typeCheckingMode = "recommended"
include = ["src/imslim"]
