[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "imslim"
version = "0.1.0"
description = "Compress your images — PNG, JPEG, WebP, AVIF and SVG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8",
]

[project.scripts]
imslim = "imslim.main:main"

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]

[tool.ruff]
builtins = ["_"]
line-length = 100

[tool.ruff.lint]
ignore = [
    "BLE001",  # blind excepts used for subprocess/tool version checks
    "LOG015",  # root logger usage carried over from source
    "S110",    # try/except/pass when gettext is unavailable
    "INT001",  # f-string inside _() is intentional (matches source)
]

[tool.setuptools.packages.find]
where = ["src"]
