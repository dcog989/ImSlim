[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "imslim"
version = "0.1.0"
description = "Compress PNG, JPEG, WebP, AVIF, GIF, and SVG images."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.11",
]

[project.scripts]
imslim = "imslim.main:main"

[dependency-groups]
dev = [
    "basedpyright>=1.1.407",
    "commitizen>=4.17.1",
    "ruff>=0.15.4",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
max_header_length = 100
message_length_limit = 100

[tool.ruff]
builtins = ["_"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
ignore = [
    "BLE001",  # blind excepts used for subprocess/tool version checks
    "LOG015",  # root logger usage carried over from source
    "S110",    # try/except/pass when gettext is unavailable
    "INT001",  # f-string inside _() is intentional (matches source)
]

[tool.basedpyright]
include = ["src/imslim"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
# PySide6's bundled stubs don't expose legacy enum/flag constants
# (e.g. Qt.AlignCenter, QMessageBox.Warning) as class attributes, even
# though they are valid at runtime; keep them as warnings, not errors.
reportAttributeAccessIssue = "warning"
# gettext installs "_" into builtins at runtime; ruff's F821 already
# covers genuinely undefined names, so pyright doesn't need to.
reportUndefinedVariable = "warning"
