[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "imslim"
version = "0.2.0"
description = "Compress PNG, JPEG, WebP, AVIF, GIF, and SVG images."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.11",
]

[project.scripts]
imslim = "imslim.main:main"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "commitizen>=4.18.0",
    "ruff>=0.16.4",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_files = ["src/imslim/__init__.py:__version__"]
major_version_zero = true
max_header_length = 100
message_length_limit = 100

[tool.ruff]
builtins = ["_"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
ignore = [
    "BLE001",  # broad excepts intentionally surface external tool failures to the user
]
