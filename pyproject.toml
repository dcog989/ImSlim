[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "imslim"
version = "0.4.0"
description = "Compress common image formats."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.11",
]

[project.scripts]
imslim = "imslim.main:main"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "pyinstaller>=6.22",
    "ruff>=0.16.4",
]

[tool.ruff]
builtins = ["_"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
ignore = [
    "BLE001",  # broad excepts intentionally surface external tool failures to the user
]
